name: Latest blog post workflow

on:
  schedule:
    # Runs daily at 12:00 UTC (5am PT / 8am ET)
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch feed and update README
        run: |
          python3 <<'PY'
          import re, urllib.request, xml.etree.ElementTree as ET
          from pathlib import Path

          url = "https://contextwindow.news/feed.xml"
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          with urllib.request.urlopen(req, timeout=30) as r:
              xml = r.read()

          root = ET.fromstring(xml)
          channel = root.find("channel")
          items = channel.findall("item")[:5]

          lines = []
          for it in items:
              title = (it.findtext("title") or "").strip()
              link = (it.findtext("link") or "").strip()
              if title and link:
                  lines.append(f"- [{title}]({link})")

          block = "<!-- BLOG-POST-LIST:START -->\n" + "\n".join(lines) + "\n<!-- BLOG-POST-LIST:END -->"

          readme = Path("README.md").read_text()
          pattern = re.compile(r"<!-- BLOG-POST-LIST:START -->.*?<!-- BLOG-POST-LIST:END -->", re.DOTALL)
          new = pattern.sub(block, readme)
          Path("README.md").write_text(new)
          print(f"Wrote {len(lines)} posts")
          PY
      - name: Commit changes
        run: |
          git config user.name "blog-post-bot"
          git config user.email "blog-post-bot@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: refresh latest posts from The Context Window"
            git push
          fi
